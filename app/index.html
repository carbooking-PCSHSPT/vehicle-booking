<div id="app"><div class="boot" role="status"><div class="bt-ring"><svg class="bt-r" viewBox="0 0 130 130"><circle class="bg" cx="65" cy="65" r="59"/><circle class="fg" cx="65" cy="65" r="59"/></svg><div class="bt-orbit"><span class="bt-van"><svg viewBox="0 0 38 24" aria-hidden="true"><path d="M3 17V7a3 3 0 0 1 3-3h17l6 5h4a2 2 0 0 1 2 2v6z" fill="currentColor"/><path d="M8 6h6v4H6V8a2 2 0 0 1 2-2zm8 0h6l4 4H16z" fill="#fff" opacity=".85"/><g class="wh"><circle cx="10" cy="18" r="3.4" fill="#1b2147"/><circle cx="10" cy="18" r="1.2" fill="#f2c14e"/></g><g class="wh"><circle cx="28" cy="18" r="3.4" fill="#1b2147"/><circle cx="28" cy="18" r="1.2" fill="#f2c14e"/></g></svg></span></div><img src="images/logo.png" alt=""></div><b class="bt-pct">0%</b><p>กำลังโหลดระบบยานพาหนะ…</p></div></div>
<script>
/* เครื่อง/เบราว์เซอร์รุ่นเก่า (iOS ต่ำกว่า 14.5 · Chrome ต่ำกว่า 88) เปิดระบบไม่ได้ → แจ้งให้อัปเดต แทนหน้าว่าง (โค้ดส่วนนี้ต้องเป็น ES5) */
(function () {
  var ok = true;
  try { new Function('var a={b:1};return a?.b??0'); } catch (e) { ok = false; }
  if (ok && window.CSS && CSS.supports) ok = CSS.supports('aspect-ratio', '1 / 1') && CSS.supports('inset', '0');
  var msg = function (t) {
    var a = document.getElementById('app');
    if (a) a.innerHTML = '<div class="boot" role="alert"><img src="images/logo.png" alt=""><p style="max-width:320px;line-height:1.7">' + t + '</p></div>';
  };
  // หน้าเปิดระบบ: วงแหวนทองเติม + รถตู้วิ่งรอบโลโก้ — เดินเร็วตอนแรกแล้วช้าลงเข้าใกล้ 96% จนระบบพร้อม (หน้าเปิดถูกแทนที่)
  var p = 0, t0 = Date.now(), MSG = [[0, 'กำลังโหลดระบบยานพาหนะ…'], [30, 'กำลังโหลดข้อมูลรถ…'], [60, 'กำลังโหลดตารางงาน…'], [85, 'เกือบเสร็จแล้ว…']];
  var tick = setInterval(function () {
    var b = document.querySelector('#app > .boot'), fg = b && b.querySelector('.fg');
    if (!b) { clearInterval(tick); return; }
    if (!fg) return;
    p = p + (96 - p) * 0.07;
    var v = Math.round(p), m = MSG[0][1];
    for (var i = 0; i < MSG.length; i++) if (v >= MSG[i][0]) m = MSG[i][1];
    fg.style.strokeDashoffset = (371 * (1 - p / 100)).toFixed(1);
    b.querySelector('.bt-orbit').style.transform = 'rotate(' + (p * 3.6).toFixed(1) + 'deg)';
    b.querySelector('.bt-pct').textContent = v + '%';
    b.querySelector('p').textContent = m;
    if (Date.now() - t0 > 60000) clearInterval(tick);
  }, 120);
  if (!ok) { window.__oldBrowser = true; msg('<b>เบราว์เซอร์นี้เก่าเกินไป</b><br>กรุณาอัปเดตแอป Chrome / Safari หรือระบบของมือถือ แล้วเปิดใหม่อีกครั้ง<br><small>(ต้องการ iOS 14.5 ขึ้นไป หรือ Chrome 88 ขึ้นไป)</small>'); return; }
  // โหลดนานผิดปกติ (เน็ตช้า/สคริปต์โหลดไม่ครบ) → บอกวิธีแก้
  setTimeout(function () { if (document.querySelector('#app > .boot')) msg('ระบบโหลดช้ากว่าปกติ…<br><small>ถ้ายังไม่ขึ้น ลองตรวจอินเทอร์เน็ต แล้ว<a href="" style="color:#24307a;font-weight:600"> รีเฟรชหน้านี้</a> · ถ้าเปิดจากแอป LINE ให้กด ⋮ แล้วเลือก “เปิดใน Chrome / Safari”</small>'); }, 20000);
})();
</script>
